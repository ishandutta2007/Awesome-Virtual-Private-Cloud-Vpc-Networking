<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; }
      }
      .bg-grid { opacity: 0.15; }
      .flow-line {
        stroke: url(#lineGrad);
        stroke-width: 2;
        stroke-dasharray: 8 12;
        animation: dash 6s linear infinite;
      }
      .node-pulse {
        animation: pulse 4s ease-in-out infinite;
      }
      .floating-group {
        animation: floatNode 5s ease-in-out infinite;
      }
      .bg-glow {
        animation: glowPulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Glow Orb -->
  <circle cx="600" cy="175" r="300" fill="url(#glow)" class="bg-glow"/>

  <!-- Grid Lines -->
  <g class="bg-grid" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Animated Network Connections (Behind Text) -->
  <g class="floating-group">
    <!-- Curved overlay network paths -->
    <path d="M 100 280 Q 300 80 600 200 T 1100 100" fill="none" class="flow-line" />
    <path d="M 50 100 Q 400 300 800 120 T 1150 260" fill="none" class="flow-line" stroke-width="1.5" />

    <!-- Network Nodes -->
    <circle cx="100" cy="280" r="6" fill="#38BDF8" class="node-pulse" />
    <circle cx="300" cy="130" r="5" fill="#818CF8" class="node-pulse" />
    <circle cx="600" cy="200" r="7" fill="#C084FC" class="node-pulse" />
    <circle cx="800" cy="120" r="5" fill="#38BDF8" class="node-pulse" />
    <circle cx="1100" cy="100" r="6" fill="#818CF8" class="node-pulse" />
  </g>

  <!-- Foreground Text Content (High Contrast, Bold, Overlay Protection) -->
  <g filter="url(#shadow)">
    <!-- Main Title -->
    <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      Awesome VPC &amp; Cloud Networking
    </text>

    <!-- Subtitle -->
    <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.2">
      Curated Directory of Cloud Isolation, Overlay Mesh &amp; Self-Hosted SDN Platforms
    </text>

    <!-- Badges / Pill Tags -->
    <g transform="translate(330, 220)">
      <!-- Pill 1: VPC -->
      <rect x="0" y="0" width="85" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="42.5" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">🔒 VPC</text>

      <!-- Pill 2: Overlay VPN -->
      <rect x="100" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
      <text x="165" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#818CF8" text-anchor="middle">🌐 Overlay VPN</text>

      <!-- Pill 3: eBPF -->
      <rect x="245" y="0" width="95" height="32" rx="16" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
      <text x="292.5" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#C084FC" text-anchor="middle">🐝 eBPF</text>

      <!-- Pill 4: SDN -->
      <rect x="355" y="0" width="85" height="32" rx="16" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
      <text x="397.5" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">⚡ SDN</text>

      <!-- Pill 5: WireGuard -->
      <rect x="455" y="0" width="115" height="32" rx="16" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="512.5" y="21" font-family="sans-serif" font-size="13" font-weight="700" fill="#F43F5E" text-anchor="middle">🛡️ WireGuard</text>
    </g>
  </g>
</svg>
